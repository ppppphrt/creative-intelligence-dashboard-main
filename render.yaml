services:
  - type: web
    name: creative-intelligence-dashboard
    runtime: node
    region: singapore
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: node scripts/runMigrations.mjs && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
